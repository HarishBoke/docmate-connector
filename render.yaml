services:
  - type: web
    name: health-doc-cms-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOW_ORIGINS
        value: https://id-preview--56bf117b-60da-473a-9a64-6cf3d41bbc1f.lovable.app,https://docmate-connector.lovable.app
      - key: DATABASE_URL
        value: sqlite:///./storage/local.db
